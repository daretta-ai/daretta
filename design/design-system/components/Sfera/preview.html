<!-- @dsCard group="Marchio" height=360 subtitle="A riposo, in ascolto, al clic" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Sfera — anteprima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@900&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
body{margin:0;background:var(--cemento);color:var(--inchiostro)}
.row{display:flex;gap:40px;padding:32px 40px;align-items:flex-start}
.stato{display:flex;flex-direction:column;align-items:center;gap:16px;width:240px}
.box{width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.sfera{width:200px;height:200px;border-radius:var(--radius-pill);background-color:#14292c;background-image:radial-gradient(circle,var(--punti) 1.6px,transparent 2.1px);background-size:10px 10px;box-shadow:var(--ombra-sfera);display:flex;align-items:center;justify-content:center}
.anello{border-radius:var(--radius-pill);border:2px dotted var(--punti);box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.onda{width:130px;height:130px;border-radius:var(--radius-pill);border:3px dotted var(--onda);box-sizing:border-box}
.spenta{background-image:radial-gradient(circle,var(--petrolio) 1.4px,transparent 1.9px);box-shadow:none}
.a{font-family:var(--font-punti);font-weight:900;font-size:140px;line-height:1;color:var(--arancio)}
.cap{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--inchiostro-muto)}
</style>
</head>
<body>
<div class="row">
<div class="stato"><div class="box"><div class="sfera"></div></div><span class="cap">01 · A RIPOSO</span></div>
<div class="stato"><div class="box"><div class="anello" style="width:236px;height:236px"><div class="anello" style="width:218px;height:218px;border-color:var(--onda);opacity:.6"><div class="sfera"><div class="onda"></div></div></div></div></div><span class="cap">02 · IN ASCOLTO</span></div>
<div class="stato"><div class="box"><div class="sfera spenta"><span class="a">à</span></div></div><span class="cap">03 · AL CLIC</span></div>
</div>
</body>
</html>
