<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Elenco — anteprima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--cemento);color:var(--inchiostro);font-family:var(--font-sans)}
.elenco{padding:28px 40px;display:flex;flex-direction:column;gap:20px}
h2{margin:0;font-size:36px;line-height:1.1;font-weight:500;letter-spacing:-1px}
.riga,.int{display:grid;grid-template-columns:56px 176px 280px minmax(0,1fr);column-gap:24px;align-items:start}
.int{padding:10px 0;border-bottom:1px solid var(--filetto-neutro);font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;color:var(--inchiostro-muto)}
.riga{padding:20px 0;border-bottom:1px solid var(--filetto)}
.c{display:flex;align-items:center;gap:8px;height:24px}
.d::after{content:"";flex:1;min-width:16px;border-bottom:2px dotted var(--bordo);transform:translateY(4px)}
.tt{display:flex;gap:2px}
.t{position:relative;width:15px;height:24px;border-radius:4px;background:var(--cemento-rilievo);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:500}
.t::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--cemento);opacity:.4}
p{margin:0;font-size:18px;line-height:1.6;color:var(--inchiostro-corpo);max-width:62ch}
</style>
</head>
<body>
<div class="elenco">
<h2>Se proprio non hai nulla da fare, leggile tutte.</h2>
<div>
<div class="int" aria-hidden="true"><span>N°</span><span>TIPO</span><span>DEST.</span><span></span></div>
<div class="riga" id="r1"></div>
<div class="riga" id="r2"></div>
</div>
</div>
<script>
(function(){
function t(s){return '<span class="tt">'+s.split("").map(function(c){return '<span class="t">'+(c===" "?"":c)+'</span>'}).join("")+'</span>'}
function riga(id,n,c,d,x){var el=document.getElementById(id);el.innerHTML='<span class="c">'+t(n)+'</span><span class="c">'+t(c)+'</span><span class="c d">'+t(d)+'</span><p></p>';el.querySelector("p").textContent=x}
riga("r1","007","SPORT","DILETTANTI","Tennis, atletica, pallamano, pallavolo… sono pieno di trofei scolastici ed ero il migliore in tutto, finché non cominciava la competizione vera.");
riga("r2","009","VIAGGI","GATE CHIUSO","Ho perso un volo addormentandomi sulle sedie di fronte al gate aperto.");
})();
</script>
</body>
</html>
