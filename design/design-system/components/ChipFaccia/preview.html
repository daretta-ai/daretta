<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Chip faccia — anteprima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--cemento-rilievo);color:var(--inchiostro)}
.row{display:flex;flex-wrap:wrap;gap:10px;padding:32px 40px}
.chip{min-height:44px;box-sizing:border-box;padding:10px 18px;border-radius:var(--radius-pill);font-family:var(--font-sans);font-size:17px;cursor:pointer}
.attiva{background:var(--inchiostro);color:var(--cemento);border:1px solid var(--inchiostro);font-weight:500}
.spenta{background:transparent;color:var(--inchiostro);border:1px solid var(--bordo)}
.chip:focus-visible{outline:2px solid var(--onda);outline-offset:3px}
</style>
</head>
<body>
<div class="row" role="group" aria-label="Le facce">
<button class="chip attiva" type="button" aria-pressed="true">Imprenditore</button>
<button class="chip spenta" type="button" aria-pressed="false">Product manager</button>
<button class="chip spenta" type="button" aria-pressed="false">Team leader</button>
<button class="chip spenta" type="button" aria-pressed="false">Developer</button>
<button class="chip spenta" type="button" aria-pressed="false">Videogiocatore</button>
</div>
</body>
</html>
