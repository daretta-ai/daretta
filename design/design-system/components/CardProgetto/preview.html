<!-- @dsCard group="Racconto" height=300 subtitle="Online e in sviluppo" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Card progetto — anteprima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
body{margin:0;background:var(--cemento-rilievo);color:var(--inchiostro)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:32px 40px;max-width:720px}
.card{--s:var(--smusso-card);clip-path:polygon(0 var(--s),var(--s) 0,calc(100% - var(--s)) 0,100% var(--s),100% calc(100% - var(--s)),calc(100% - var(--s)) 100%,var(--s) 100%,0 calc(100% - var(--s)));background:var(--cemento-incavo);padding:28px;display:flex;flex-direction:column;gap:14px;min-height:200px;box-sizing:border-box}
.stato{display:flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.5px;color:var(--inchiostro-muto)}
.dot{width:8px;height:8px;border-radius:var(--radius-tondo);box-sizing:border-box}
.online{background:var(--arancio)}
.sviluppo{border:1.5px solid var(--stato-spento)}
.nome{font-family:var(--font-sans);font-size:24px;font-weight:600;line-height:1.25}
.desc{font-family:var(--font-sans);font-size:16px;line-height:1.45;color:var(--inchiostro-secondario)}
</style>
</head>
<body>
<div class="grid">
<div class="card"><span class="stato"><span class="dot online"></span>ONLINE</span><span class="nome">[Nome progetto]</span><span class="desc">[Una riga su cosa fa.]</span></div>
<div class="card"><span class="stato"><span class="dot sviluppo"></span>IN SVILUPPO</span><span class="nome">App per la terapia ABA</span><span class="desc">Con una rete di centri specializzati.</span></div>
</div>
</body>
</html>
