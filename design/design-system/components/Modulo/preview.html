<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Modulo — anteprima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:var(--cemento);color:var(--inchiostro)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:32px 40px}
.mod{border-radius:var(--radius-modulo);padding:32px;min-height:220px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.vicino{background:radial-gradient(420px 320px at 80% 40%,var(--petrolio-luce) 0%,var(--cemento-rilievo) 85%)}
.medio{background:radial-gradient(520px 300px at 84% -12%,var(--petrolio-alone) 0%,var(--cemento-rilievo) 62%)}
.lontano{background:var(--cemento-rilievo)}
.lab{font-family:var(--font-mono);font-size:13px;letter-spacing:1px;color:var(--inchiostro-muto)}
.t{font-family:var(--font-sans);font-size:22px;font-weight:500;line-height:1.3}
</style>
</head>
<body>
<div class="grid">
<div class="mod vicino"><span class="lab">VICINO ALLA SFERA</span><span class="t">Hero, foto</span></div>
<div class="mod medio"><span class="lab">DISTANZA MEDIA</span><span class="t">Chi sono</span></div>
<div class="mod lontano"><span class="lab">LONTANO</span><span class="t">Progetti</span></div>
</div>
</body>
</html>
