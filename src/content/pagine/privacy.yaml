titolo: privacy.
attacco: Se ti iscrivi alla newsletter, mi lasci solo la tua email. La uso per mandarti una mail al mese, e per nient'altro.
sezioni:
  - titolo: Chi tiene i dati
    testo: Io, Patrizio Bartolozzi. Per qualsiasi cosa scrivimi a dimmipure@daretta.it.
  - titolo: Dove stanno
    testo: Le mail partono da Kit, Inc., che conserva gli indirizzi su server negli Stati Uniti. Il trasferimento è coperto dal Data Privacy Framework tra Unione europea e Stati Uniti, a cui Kit aderisce.
  - titolo: Per quanto
    testo: Finché resti iscritto. Il link per andartene è in fondo a ogni mail.
  - titolo: I tuoi diritti
    testo: Puoi chiedermi di vedere, correggere o cancellare del tutto i tuoi dati, e lo faccio entro un mese. Puoi anche fare reclamo al Garante per la protezione dei dati personali.
  - titolo: Sul sito
    testo: Niente cookie. Conto le visite, ma non so chi sei.
