titolo: dà retta a un cretino.
testo: |-
  Una volta al mese ti mando qualche spunto dai miei progetti, gli articoli e qualche opinione… se mi scappa.

  Non ti vendo niente, ma se leggendo ti viene voglia di fare qualcosa insieme, rispondi alla mail, vediamo cosa ne esce.
segnaposto: la tua email
pulsante: Iscrivimi
privacy: Come tratto i tuoi dati
inviato: Conferma il tuo indirizzo e ci risentiremo alla prossima newsletter.
giaIscritto: Apprezzo l'insistenza, ma sei già iscritto. Tranquillo, non ti arriverà doppia.
mailNonValida: La mia mail è strana, ma questa sembra proprio sbagliata. Dacci un occhio.
errore: Qualcosa è andato storto, e stavolta non è colpa tua. Riprova tra poco.
etichettaInviato: verifica la mail
etichettaGiaIscritto: di nuovo?
etichettaMailNonValida: mail sbagliata?
etichettaErrore: azz
articoloTitolo: ti è piaciuto?
articoloTesto: |-
  Una volta al mese ti mando il prossimo articolo, qualche spunto dai miei progetti e qualche opinione… se mi scappa.

  Non ti vendo niente, ma se leggendo ti viene voglia di fare qualcosa insieme, rispondi alla mail, vediamo cosa ne esce.
progettoTitolo: ti interessa?
progettoTesto: |-
  Una volta al mese ti racconto come vanno i miei progetti, con gli articoli e qualche opinione… se mi scappa.

  Non ti vendo niente, ma se leggendo ti viene voglia di fare qualcosa insieme, rispondi alla mail, vediamo cosa ne esce.
benvenutoTitolo: benvenuto.
benvenutoTesto: Da adesso, una mail al mese. In fondo a ognuna c'è il modo per andartene… senza rancore.
